# MMT configuration - bash syntax, sourced by the `mmt` wrapper.
#
# Read in this order (later wins):
#   1. config/mmt.conf          this file: defaults, kept in git
#   2. config/site.conf         your cluster's paths (copy config/site.example.conf), NOT in git
#   3. $MMT_CONFIG              a file named in the environment
#   4. --config FILE            a file named on the command line
#   5. command-line options     e.g. -i, -o, --tmp, -l, -t
#
# An empty path means "must come from a later file or the command line".
# `mmt check` prints the values in effect.

# ---------------------------------------------------------------- inputs (MATAFILER4 + GeneCat)
MMT_MF4_RUN=""          # MATAFILER4 run folder (#OutPath/#RunID of the map): one sub-folder per sample      (-i)
                        #   empty: taken from the map's #OutPath + #RunID
MMT_GENECAT=""          # GeneCat output folder (the -GCd folder: holds Bin_<binner>/MAGvsGC.txt.gz)          (--genecat)
MMT_MAP=""              # MATAFILER4 map: raw kinetics BAM of a sample = <#DirPath><SmplPrefix>.bam             (--map)
MMT_BINNER="SB"         # binner tag: GeneCat Bin_<tag>/ and MATAFILER Binning/<tag>/ (SB = SemiBin)

# ---------------------------------------------------------------- working folders
MMT_OUT=""              # results folder, reused by every run and module: one folder per analysis              (-o)
MMT_TMP=""              # work space; empty = $TMPDIR (SLURM node-local), else /tmp                            (--tmp)
                        #   holds caches - on a cluster use a shared scratch folder so jobs share them:
                        #   <tmp>/mmt/<OUT name>_<key>/index (MATAFILER4 / GeneCat layout, read -> MAG per sample),
                        #   <tmp>/mmt/refs* (representative / MAG indexes) ; rebuilt whenever missing
                        #   work folders: <tmp>/mmt/<OUT name>_<key>/<analysis>/<sample> - removed when the sample ends
                        #   (kept with --debug)
MMT_LOG_DIR=""          # keep run logs here: <dir>/<analysis>/<sample>.log ; empty = no run log kept           (-l)

# ---------------------------------------------------------------- tools
# SMRT Link is installed separately (not from conda): ipdSummary, ccs-kinetics-bystrandify, pbmm2, pbindex
MMT_SMRT_BIN=""         # SMRT Link .../smrtcmds/bin ; empty = take the four tools from PATH
MMT_ENV_PREFIX=""       # a micromamba env prefix (base = the micromamba root); its bin/ goes first on PATH
MMT_PYTHON="python3"    # needs pysam
MMT_SAMTOOLS="samtools" # needs >= 1.15 (mpileup --reverse-del, view -N / -e)
MMT_DUCKDB="duckdb"     # DuckDB command-line binary (validated with 1.1.3)
MMT_IPD_ARGS=""         # extra ipdSummary arguments, as they are (e.g. "--ipdModel /path/model.npz.gz") ; empty =
                        #   ipdSummary picks the kinetics model matching each BAM's chemistry. Recorded per sample;
                        #   changing it redoes the results (MGScall, ctg-meth)                                  (--ipd-args)

# ---------------------------------------------------------------- resources
# empty = taken from SLURM (cpus-per-task, mem) when running in a job, else the fall-backs below
MMT_THREADS=""          # fall-back 4                                                                       (-t)
MMT_MEM_GB=""           # fall-back 16                                                                      (--mem)

# ---------------------------------------------------------------- MGScall
# Changing any of these makes the next MGScall run redo the results they affect (results remember their settings).
MGSCALL_KEEP_DUP=0          # 1 = also use reads MATAFILER flagged as duplicate (0x400) ; QC-fail (0x200) reads are never used
MGSCALL_MIN_IDENTITY=95     # pbmm2 -y: minimum identity (%) of a read to the representative
MGSCALL_MIN_MAPQ=10         # minimum MAPQ on the representative (repeats inside the representative are dropped)
MGSCALL_MIN_PCT_ALIGNED=50  # the alignment must cover >= this % of the read ...
MGSCALL_MIN_ALN_BP=1000     # ... and >= this many bp
MGSCALL_MIN_ROW_COV=3       # rows written from this kinetic coverage (3 = every ipdSummary row)
MGSCALL_CTX=10              # +- bp context checked for sequence differences (ctx_alt_* columns)
MGSCALL_CLIP_MIN=10         # soft clips >= this bp count as junctions in that context (clip_ctx_n)
# Presence: a sample is processed for an MGS when its assembly has a MAG of the MGS (any reads: rows need >= 3) ;
# where GeneCat's abundance table (Bin_<binner>/Annotation/Abundance/MGS.matL0.txt) has the MGS but no MAG was binned,
# the mmt log and 'mmt status' say so (no reads are assigned to it there).

# ---------------------------------------------------------------- ctg-meth (docs/ctg-meth.md)
# Changing any of these makes the next ctg-meth run recompute the results they affect (kinetics). Reads are those
# MATAFILER4 placed on the MAG (CRAM), aligned to the MAG's own contigs.
CTGMETH_KEEP_DUP=0          # 1 = also use reads MATAFILER flagged as duplicate (0x400) ; QC-fail (0x200) reads are never used
CTGMETH_MIN_IDENTITY=98     # pbmm2 -y: minimum identity (%) of a read to its own MAG (other strains' reads are not wanted)
CTGMETH_MIN_MAPQ=10         # minimum MAPQ (repeats inside the MAG are dropped) - read set 'all' and every junction piece
CTGMETH_MIN_PCT_ALIGNED=50  # read set 'all': the primary alignment covers >= this % of the read ...
CTGMETH_MIN_ALN_BP=1000     # ... and >= this many bp
CTGMETH_MIN_ROW_COV=3       # rows written from this kinetic coverage (3 = every ipdSummary row)
CTGMETH_CTX=10              # +- bp context checked for sequence differences (ctx_alt_* columns) ; also the margin kept
                            #   between a window's clipped end and its reported rows
CTGMETH_CLIP_MIN=10         # soft clips >= this bp count as junctions in that context (clip_ctx_n)
CTGMETH_PRESENT_MOL=1       # an MGS counts as present in a sample from this many molecules on its MAG(s) there; fewer =
                            #   'absent': recorded, not processed (cf. CTGMETH_MIN_MOL: molecules a junction read set needs)
# junction read sets (large rearrangements only: no SNV calling)
CTGMETH_JUNCTIONS=1         # 0 = detect and list breakpoints, but call no junction read sets (no extra rows)
CTGMETH_MIN_SV=300          # smallest deletion / insertion / duplication (bp) that makes a breakpoint (split reads, CIGAR
                            #   D / I) ; inversions: any split, or a short one passed through by the aligner (dense region
                            #   whose read is the reverse complement of the contig)
CTGMETH_ANCHOR=1000         # a REF molecule spans the breakpoint with >= this many aligned bp on each side
CTGMETH_TOL=20              # breakpoints within this many bp are one
CTGMETH_MIN_MOL=5           # molecules a read set needs to be called (and REF + ALT at a breakpoint to be compared)
CTGMETH_MIN_FRAC=0.02       # ... and its share of the molecules at its breakpoint
CTGMETH_WINDOW=5000         # largest callable distance (bp) into each side of a breakpoint

# ---------------------------------------------------------------- derep-ctg (docs/derep-ctg.md)
# Changing any of these makes the next run redo every MGS (results remember their settings). Supports are numbers of
# MAGs of the MGS; prevalences are completeness-adjusted (MAGs with the family / sum of the MAGs' completeness).
MMT_MINIMAP2="minimap2"     # minimap2 for instance identity (DEREP_IDENTITY=1)
DEREP_GC_ID=95              # GeneCat catalogue identity: compl.incompl.<id>.fna.clstr.idx + compl.incompl.<id>.prot.faa
DEREP_PREP_CHECK=200        # per assembly, the first N genes of genes.gff checked against genes.shrtHD.fna (0 = no check)
# gene families: catalogue genes merged when they fill the same slot (same flanking gene ends) in different MAGs,
# never co-occur in one MAG, and their proteins are this identical (Panaroo family step; 0 = never merge)
DEREP_FAM_MIN_ID=0.7        # protein identity over the shorter protein (edlib, infix)
DEREP_FAM_LEN_RATIO=0.8     # shorter / longer protein length
# families that cannot anchor a block (bridged: their neighbours are joined across them)
DEREP_MAX_COPY=3            # linker: this many copies in any one MAG ...
DEREP_DUP_MARGIN=0.05       # ... or more than one copy in this share of its MAGs, and in >= 2 (PPanGGOLiN "multigenic")
DEREP_MIXED_MAG=0.1         # a MAG with more than this share of its catalogue genes in several copies holds co-binned
                            #   strains: its copies make no linker and do not keep alleles apart
DEREP_HUB_PARTNERS=5        # hub: >= this many different neighbours at BOTH ends, none in half of them (0 = off)
DEREP_MIN_FAMILY_MAGS=2     # rare: in fewer MAGs than this
# blocks
DEREP_CORE_PREV=0.7         # core blocks are built from families at least this prevalent; the rest -> accessory blocks
DEREP_SYNTENY=0.9           # an adjacency joins a block only if >= this share of the MAGs with a neighbour at EACH of
                            #   the two gene ends show this neighbour (contig ends do not count) ; > 0.5
DEREP_MIN_EDGE_MAGS=2       # ... and it is seen in >= this many MAGs (capped at the number of MAGs of the MGS)
DEREP_MAX_INSERT_BP=10000   # ... and at most (1 - DEREP_SYNTENY) of those MAGs carry more than this many extra bp there;
                            #   in an instance, a larger insert splits it
DEREP_MAX_SKIP=3            # deletions / insertions of up to this many genes agree with a block's order (block building),
                            #   and an instance may miss this many block genes in a row
DEREP_MIN_BLOCK_GENES=3     # smallest block (genes) ...
DEREP_MIN_BLOCK_BP=2000     # ... and (bp, consensus length)
DEREP_IDENTITY=1            # 1 = identity of every instance to its block's sequence (minimap2) ; 0 = skip
